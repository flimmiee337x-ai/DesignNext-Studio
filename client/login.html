<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | DesignNext Studio</title>
  <link rel="icon" href="../images/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="client-login" data-root="../">
  <div class="auth-wrap">
    <div class="grid-bg"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
    <div class="auth-card glass fade-up">
      <div id="authLogo"></div>
      <h2>Client Area</h2>
      <p>เข้าสู่ระบบเพื่อติดตามโปรเจกต์ ใบเสนอราคา และไฟล์งานของคุณ</p>

      <div class="tabs" role="tablist">
        <button class="active" data-tab="login" type="button">เข้าสู่ระบบ</button>
        <button data-tab="register" type="button">สมัครสมาชิก</button>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password" required></div>
        <div class="flex between small"><span></span><button type="button" class="link-arrow small" id="forgotBtn">ลืมรหัสผ่าน?</button></div>
        <button class="btn btn-primary btn-block" type="submit">เข้าสู่ระบบ</button>
      </form>

      <form id="registerForm" class="auth-form hidden" novalidate>
        <div class="field"><label>ชื่อ-นามสกุล <span class="req">*</span></label><input name="name" required></div>
        <div class="field"><label>บริษัท</label><input name="company"></div>
        <div class="field"><label>เบอร์โทร <span class="req">*</span></label><input name="phone" type="tel" required></div>
        <div class="field"><label>Email <span class="req">*</span></label><input name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร) <span class="req">*</span></label><input name="password" type="password" autocomplete="new-password" required></div>
        <div class="field"><label>ยืนยันรหัสผ่าน <span class="req">*</span></label><input name="confirm" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-primary btn-block" type="submit">สมัครสมาชิก</button>
      </form>

      <div id="demoHint"></div>
      <p class="small center mt-2 mb-0"><a href="../index.html" class="link-arrow">← กลับหน้าเว็บไซต์</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/client.js"></script>
</body>
</html>
