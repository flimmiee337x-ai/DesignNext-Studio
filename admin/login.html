<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | DesignNext Studio</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-login" data-root="../">
  <main class="auth-wrap">
    <div class="grid-bg"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
    <div class="auth-card glass fade-up">
      <a href="../index.html" class="logo">
        <img src="../images/logo/logo.svg" alt="DesignNext Studio logo" onerror="this.remove()">
        <span>Design<b>Next</b></span>
      </a>
      <span class="eyebrow" style="display:flex;width:max-content;margin:0 auto 14px">Staff Only</span>
      <h2>Admin Login</h2>
      <p>สำหรับผู้ดูแลระบบและพนักงานเท่านั้น</p>
      <form id="adminLoginForm" class="auth-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="admin@designnext.studio" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">🔐 เข้าสู่ระบบ Admin</button>
      </form>
      <div id="demoHint"></div>
      <p class="small center mt-2"><a href="../index.html" class="link-arrow">← กลับหน้าเว็บไซต์</a> &nbsp;·&nbsp; <a href="../client/login.html" class="link-arrow">Customer Login</a></p>
    </div>
  </main>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
