<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | DesignNext Studio</title>
  <meta name="description" content="จองคิวปรึกษาโปรเจกต์กับ DesignNext Studio">
  <link rel="icon" href="../images/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .booking-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
    .step-pane h3 { margin-bottom: 6px; }
    .step-pane > p { margin-bottom: 22px; }
    .wizard-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
    .summary-list { display: grid; gap: 10px; }
    .summary-list div { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); font-size: .92rem; }
    .summary-list div span:first-child { color: var(--dim); flex-shrink: 0; }
    .summary-list div span:last-child { color: var(--white); text-align: right; word-break: break-word; }
    .status-legend { display: grid; gap: 10px; font-size: .88rem; }
    .status-legend div { display: flex; gap: 10px; align-items: center; }
    .status-legend .status { min-width: 110px; justify-content: center; }
    @media (max-width: 980px) { .booking-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="booking" data-root="../">
  <header id="site-header"></header>

  <section class="page-hero">
    <div class="grid-bg"></div><div class="orb orb-1"></div>
    <div class="container">
      <div class="breadcrumb fade-up"><a href="../index.html">Home</a><span>/</span><span>Booking</span></div>
      <span class="eyebrow fade-up">Book a Consultation</span>
      <h1 class="fade-up d1">จองคิว <span class="gradient-text">นัดหมายปรึกษา</span></h1>
      <p class="fade-up d2">เลือกบริการ แพ็กเกจ วันและเวลาที่สะดวก ทีมงานจะยืนยันนัดหมายภายใน 24 ชั่วโมง</p>
    </div>
  </section>

  <section class="section" style="padding-top:20px">
    <div class="container booking-layout">
      <div class="card reveal" id="wizard">
        <div class="stepper" id="stepper"></div>
        <div id="stepBody"></div>
        <div class="wizard-nav">
          <button class="btn btn-ghost" id="prevBtn">← ย้อนกลับ</button>
          <button class="btn btn-primary" id="nextBtn">ถัดไป →</button>
        </div>
      </div>

      <aside class="grid" style="gap:24px">
        <div class="card reveal delay-1">
          <h3>🧾 สรุปการจอง</h3>
          <div class="summary-list mt-1" id="sideSummary"></div>
        </div>
        <div class="card reveal delay-2">
          <h3>🔎 ตรวจสอบสถานะการจอง</h3>
          <form id="lookupForm" class="auth-form mt-1" novalidate>
            <div class="field"><label>Booking ID</label><input name="bid" placeholder="DN-BK-0001" required></div>
            <div class="field"><label>Email ที่ใช้จอง</label><input name="email" type="email" required></div>
            <button class="btn btn-ghost btn-block" type="submit">ตรวจสอบ</button>
          </form>
          <div id="lookupResult" class="mt-1"></div>
        </div>
        <div class="card reveal delay-3">
          <h3>📌 สถานะการจอง</h3>
          <div class="status-legend mt-1" id="statusLegend"></div>
        </div>
      </aside>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
